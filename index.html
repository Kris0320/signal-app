<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Signal · Event discovery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="device">
    <!-- ============ FEED ============ -->
    <section class="screen screen--feed is-active" data-screen="feed">
      <header class="topbar topbar--feed">
        <button class="location-switcher" data-action="open-city" aria-label="Change location">
          <svg class="location-switcher__pin" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 21s-7-6.4-7-11.5a7 7 0 1 1 14 0c0 5.1-7 11.5-7 11.5Z"/>
            <circle cx="12" cy="9.5" r="2.5"/>
          </svg>
          <span class="location-switcher__label" id="location-label">London</span>
          <svg class="location-switcher__chev" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </button>
      </header>

      <div class="search-trigger" data-action="open-search" role="button" tabindex="0">
        <svg class="search-trigger__icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/>
          <path d="M20 20l-3.5-3.5"/>
        </svg>
        <span class="search-trigger__text">Search events, speakers, venues</span>
      </div>

      <div class="chip-row" id="feed-chips" role="tablist" aria-label="Quick filters"></div>

      <div class="feed-scroll">
        <div id="feed-list" class="feed-list"></div>
        <div id="feed-empty" class="empty hidden">
          <p>No events match these filters.</p>
          <button class="text-btn" data-action="reset-feed-filters">Reset filters</button>
        </div>
      </div>
    </section>

    <!-- ============ SEARCH ============ -->
    <section class="screen screen--search" data-screen="search">
      <header class="search-bar">
        <button class="icon-btn" data-action="close-search" aria-label="Back">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <input id="search-input" class="search-input" type="search" placeholder="Search events, speakers, venues" autocomplete="off" />
        <button class="icon-btn" aria-label="Voice search" disabled>
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="9" y="3" width="6" height="11" rx="3"/>
            <path d="M5 11a7 7 0 0 0 14 0"/>
            <path d="M12 18v3"/>
          </svg>
        </button>
      </header>

      <div class="chip-row chip-row--scroll" id="search-chips"></div>

      <div class="search-scroll">
        <h2 class="section-label">Recent searches</h2>
        <ul id="recent-list" class="recent-list"></ul>

        <h2 class="section-label">Sources</h2>
        <div id="source-chips" class="chip-grid"></div>

        <h2 class="section-label" id="search-results-label" hidden>Results</h2>
        <div id="search-results" class="feed-list"></div>
      </div>
    </section>

    <!-- ============ SAVED ============ -->
    <section class="screen screen--saved" data-screen="saved">
      <header class="topbar topbar--saved">
        <h1 class="page-title">Saved</h1>
        <button class="icon-btn" data-action="open-search" aria-label="Search">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7"/>
            <path d="M20 20l-3.5-3.5"/>
          </svg>
        </button>
      </header>

      <button class="info-card" id="clash-card" data-action="open-saved-calendar" aria-label="Open saved calendar">
        <span class="info-card__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="5" width="16" height="15" rx="2"/>
            <path d="M4 10h16M9 3v4M15 3v4"/>
          </svg>
        </span>
        <div class="info-card__text">
          <div class="info-card__title" id="clash-title">No clashes across your saved events</div>
          <div class="info-card__sub" id="clash-sub">You're all set for this period.</div>
        </div>
        <span class="info-card__chev" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </span>
      </button>

      <div class="segmented" id="saved-segmented" role="tablist" aria-label="Saved view"></div>

      <div class="saved-scroll">
        <div id="saved-list" class="saved-list"></div>
        <div id="saved-empty" class="empty hidden">
          <p>Nothing saved yet.</p>
          <button class="text-btn" data-action="go-feed">Browse the feed</button>
        </div>
      </div>
    </section>

    <!-- ============ DETAIL ============ -->
    <section class="screen screen--detail" data-screen="detail">
      <header class="detail-bar">
        <button class="icon-btn" data-action="close-detail" aria-label="Back">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <span class="detail-bar__spacer"></span>
        <button class="icon-btn" data-action="share-detail" aria-label="Share">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 4v12"/>
            <path d="M8 8l4-4 4 4"/>
            <path d="M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/>
          </svg>
        </button>
      </header>

      <div class="detail-scroll">
        <div class="detail-media" id="detail-media">event media</div>

        <h2 class="detail-title" id="detail-title"></h2>
        <p class="detail-desc" id="detail-desc"></p>

        <div class="tag-row" id="detail-tags"></div>

        <div class="detail-meta">
          <div class="detail-meta__row">
            <span class="detail-meta__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="4" y="5" width="16" height="15" rx="2"/>
                <path d="M4 10h16M9 3v4M15 3v4"/>
              </svg>
            </span>
            <div>
              <div class="detail-meta__primary" id="detail-date"></div>
              <div class="detail-meta__secondary" id="detail-duration"></div>
            </div>
          </div>
          <div class="detail-meta__row">
            <span class="detail-meta__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 21s-7-6.4-7-11.5a7 7 0 1 1 14 0c0 5.1-7 11.5-7 11.5z"/>
                <circle cx="12" cy="9.5" r="2.5"/>
              </svg>
            </span>
            <div>
              <div class="detail-meta__primary" id="detail-venue"></div>
              <div class="detail-meta__secondary" id="detail-price"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="detail-cta">
        <button class="icon-btn icon-btn--surface" data-action="toggle-save-detail" aria-label="Save event">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-6-3-6 3V3z"/></svg>
        </button>
        <button class="primary-btn" id="detail-open-btn" data-action="open-source">
          <span id="detail-open-label">Open on source</span>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M14 4h6v6"/>
            <path d="M20 4l-9 9"/>
            <path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/>
          </svg>
        </button>
      </div>
    </section>

    <!-- Calendar drawer (opened from a saved item's date block) -->
    <div class="drawer-backdrop hidden" id="drawer-backdrop" data-action="close-drawer"></div>
    <aside class="drawer hidden" id="calendar-drawer" aria-hidden="true" aria-label="Event date">
      <div class="drawer__handle" aria-hidden="true"></div>
      <header class="drawer__head">
        <div>
          <div class="drawer__eyebrow" id="drawer-eyebrow">Event date</div>
          <div class="drawer__title" id="drawer-title"></div>
        </div>
        <button class="icon-btn" data-action="close-drawer" aria-label="Close">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>
      <div class="cal">
        <div class="cal__month" id="cal-month"></div>
        <div class="cal__dow" aria-hidden="true">
          <span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span><span>Su</span>
        </div>
        <div class="cal__grid" id="cal-grid"></div>
      </div>
    </aside>

    <!-- City picker drawer (opened from the Discover location switcher) -->
    <div class="drawer-backdrop hidden" id="city-backdrop" data-action="close-city"></div>
    <aside class="drawer hidden" id="city-drawer" aria-hidden="true" aria-label="Choose location">
      <div class="drawer__handle" aria-hidden="true"></div>
      <header class="drawer__head">
        <div>
          <div class="drawer__title">Choose city</div>
        </div>
        <button class="icon-btn" data-action="close-city" aria-label="Close">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>
      <ul class="city-list" id="city-list"></ul>
    </aside>

    <!-- Saved calendar drawer (opened from the clash info-card) -->
    <div class="drawer-backdrop hidden" id="saved-cal-backdrop" data-action="close-saved-calendar"></div>
    <aside class="drawer drawer--tall hidden" id="saved-calendar-drawer" aria-hidden="true" aria-label="Saved calendar">
      <div class="drawer__handle" aria-hidden="true"></div>
      <header class="drawer__head">
        <div class="drawer__title" id="saved-cal-month"></div>
        <div class="drawer__head-actions">
          <button class="icon-btn" data-action="saved-cal-prev" aria-label="Previous month">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <button class="icon-btn" data-action="saved-cal-next" aria-label="Next month">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
          </button>
          <button class="icon-btn" data-action="close-saved-calendar" aria-label="Close">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
      </header>
      <div class="cal">
        <div class="cal__dow" aria-hidden="true">
          <span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span><span>Su</span>
        </div>
        <div class="cal__grid cal__grid--interactive" id="saved-cal-grid"></div>
      </div>
      <div class="saved-cal-day">
        <div class="saved-cal-day__label" id="saved-cal-day-label"></div>
        <div class="saved-list saved-list--inline" id="saved-cal-day-list"></div>
      </div>
    </aside>

    <!-- Bottom nav -->
    <nav class="bottom-nav" id="bottom-nav" aria-label="Primary">
      <button class="nav-btn is-active" data-nav="feed" aria-label="Discover">
        <span class="nav-btn__icon">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 11l9-7 9 7"/>
            <path d="M5 10v10h14V10"/>
          </svg>
        </span>
        <span class="nav-btn__label">Discover</span>
      </button>
      <button class="nav-btn" data-nav="saved" aria-label="Saved">
        <span class="nav-btn__icon">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-3-6 3V3z"/></svg>
        </span>
        <span class="nav-btn__label">Saved</span>
      </button>
    </nav>

    <div class="toast hidden" id="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
